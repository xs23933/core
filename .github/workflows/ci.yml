name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install protobuf generation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
      - name: Check local-model context
        run: |
          python3 scripts/build-handler-context.py --check
          python3 -m unittest discover -s scripts -p 'test_*context.py'
      - name: Verify dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1 -timeout=10m
      - name: Build
        run: go build ./...
      - name: Published scaffold baseline
        run: bash scripts/check-scaffold-release.sh
      - name: Concurrency stress tests
        run: bash scripts/stress.sh
